// Ask Zelmio searches locally saved information. No external AI service required.
let askText='',askAnswer='';
let zelmioSpeakEnabled=localStorage.getItem('zelmio_speak_enabled')!=='false';
let zelmioLastSpeech='';
let zelmioSpeechSeq=0;
function zelmioSpeak(text){
 if(!zelmioSpeakEnabled||!text||!('speechSynthesis' in window))return;
 try{
  zelmioSpeechSeq++;
  speechSynthesis.cancel();
  zelmioLastSpeech=text;
  // Speak warranty references as separate digit utterances, never as a cardinal number.
  // The full answer remains visible on screen.
  const refMatch=text.match(/(?:warranty|guarantee)\s+(?:number|reference)\s+for\s+your\s+.+?\s+is\s+([A-Z0-9-]*\d[A-Z0-9-]*)\.?$/i);
  const spoken=refMatch
    ? 'Warranty number: '+[...refMatch[1]].filter(c=>/[A-Z0-9]/i.test(c)).join(', ')+'.'
    : text;
  const u=new SpeechSynthesisUtterance(spoken);
  u.lang='en-GB';u.rate=.94;u.pitch=1;
  const voices=speechSynthesis.getVoices();
  const v=voices.find(x=>x.lang==='en-GB')||voices.find(x=>x.lang&&x.lang.startsWith('en'));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
 }catch(e){toast('Speech playback unavailable')}
}

function zelmioPossessive(name){return /s$/i.test(name)?name+"'":name+"'s";}
function zelmioSavedFact(e,kind){
 const direct=kind==='purchase'?(e.purchased||e.purchaseDate||e.datePurchased||e.purchase_date||e.bought||''):
 kind==='warrantyDate'?(e.warranty||e.warrantyExpiry||e.warrantyEnd||''):
 kind==='warrantyNumber'?(e.warrantyNumber||e.warrantyReference||e.guaranteeNumber||''):'';
 if(direct)return String(direct).trim();
 const note=[e.note,e.history,e.details].filter(Boolean).join('\n');
 if(kind==='purchase'){
  const m=note.match(/(?:purchase(?:d)?(?:\s+date)?|date\s+(?:bought|purchased)|bought(?:\s+on)?|date of purchase)\s*[:#-]?\s*(\d{4}-\d{2}-\d{2}|\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}|\d{1,2}\s+[A-Za-z]+\s+\d{4})/i);
  return m?m[1].trim():'';
 }
 const label=kind==='warrantyDate'?/(?:warranty\s+(?:expiry|expires|end(?:s)?|until)|guarantee\s+(?:expiry|expires|until))/i:
 /(?:warranty|guarantee)\s*(?:number|no\.?|reference|ref\.?|#)/i;
 const m=note.match(new RegExp(label.source+'\\s*[:#-]?\\s*([^\\n;,]+)','i'));
 return m?m[1].trim().replace(/[. ]+$/,''):'';
}
function zelmioExplain(e,q){
 const title=(e.title||'item').trim(), room=roomName(e.room);
 const question=q.toLowerCase();
 const where=/\b(where|find|located|which room|put|kept|stored)\b/.test(question);
 const bought=/\b(bought|buy|purchased|purchase date|when did i get|when was it bought)\b/.test(question);
 const warranty=/warrant|guarantee|expir/.test(question);
 const warrantyNumber=warranty&&/\b(number|no\.?|reference|ref\.?|code)\b/.test(question);
 const model=/model|serial/.test(question);
 const status=/\b(done|completed|finished|status)\b/.test(question);
 const due=/\b(when|due|next|date)\b/.test(question);
 if(e.type==='job'){
  if(status)return `${title} is ${e.done?'completed':'not yet completed'}.`;
  if(where)return `${title} is listed under ${room}.`;
  if(due)return e.due?`${title} is due on ${askDate(e.due)}.`:`I don't have a due date saved for ${title}.`;
  return `${title} is ${e.done?'completed':'not yet completed'}.`;
 }
 // Specific warranty questions must be handled before any generic date wording.
 if(warrantyNumber){
  const number=zelmioSavedFact(e,'warrantyNumber');
  return number?`The warranty number for your ${title} is ${number}.`:`I don't have a warranty number saved for your ${title}.`;
 }
 if(warranty){
  const expiry=zelmioSavedFact(e,'warrantyDate');
  if(!expiry)return `I don't have a warranty expiry date saved for your ${title}.`;
  if(/\b(still|valid|covered|under warranty)\b/.test(question)){
   const parsed=new Date(expiry);
   if(!Number.isNaN(parsed.getTime()))return parsed>=new Date(new Date().toDateString())?`Yes, your ${title} is under warranty until ${askDate(expiry)}.`:`No, your ${title}'s warranty expired on ${askDate(expiry)}.`;
  }
  return `Your ${title}'s warranty expires on ${askDate(expiry)}.`;
 }
 if(bought){
  const purchased=zelmioSavedFact(e,'purchase');
  return purchased?`You bought your ${title} on ${askDate(purchased)}.`:`I don't have a purchase date saved for your ${title}.`;
 }
 if(model)return e.model?`The model number is ${e.model}.`:`I don't have a model number saved for your ${title}.`;
 if(where){
  let note=(e.note||'').trim().split(/[\n.!?]/)[0].trim();
  const looksLikePlace=/\b(shelf|drawer|cupboard|cabinet|under|above|beside|next to|behind|inside|on top|wardrobe|box|storage|left|right|corner|hob|unit|rack)\b/i.test(note);
  if(!looksLikePlace||note.length>100)note='';
  note=note.replace(/^(?:location|stored|kept|place|position)\s*[:\-]\s*/i,'').replace(/[,. ]+$/,'');
  return `Your ${title} is in the ${room}${note?', '+note:''}.`;
 }

}
function zelmioFollowUp(q,previous){
 if(!previous)return false;
 const t=q.toLowerCase().replace(/[’]/g,"'").trim();
 const intent=/\b(where|location|find|kept|stored|when|bought|buy|purchase|date|warranty|guarantee|expiry|expire|reference|number|model|serial|covered)\b/.test(t);
 if(!intent)return false;
 // Only use conversation context for genuinely subject-free follow-ups.
 // "Where is my kettle?" must search for kettle, not reuse the toaster.
 const ignored=new Set(['where','is','are','was','were','did','do','does','i','my','me','our','the','a','an','it','its','that','this','one','and','so','okay','ok','then','what','about','how','when','which','can','you','tell','please','of','for','on','in','at','to','have','has','got','get','buy','bought','purchase','purchased','date','warranty','guarantee','expiry','expire','expires','expiring','number','reference','ref','model','serial','location','find','kept','stored','covered','still','under','valid','with','your','item','thing']);
 const subjectWords=t.replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w&&!ignored.has(w));
 if(subjectWords.length)return false;
 return /\b(it|its|that|this)\b/.test(t) ||
 /^(?:(?:and|so|okay|ok|then|what about|how about|tell me|please)\s+)*(?:the\s+)?(?:warranty|guarantee|purchase|bought|buy|date|when|where|model|serial|reference|number|expiry|is it|does it|did i|what date)\b/.test(t);
}
function zelmioFollowUpAnswer(e,q){
 const full=zelmioExplain(e,q),t=q.toLowerCase();
 // Short conversational replies, preserving the existing spoken reference-number fix.
 if(/warrant|guarantee/.test(t) && /\b(number|reference|no\.?)\b/.test(t))return full;
 if(/\b(bought|buy|purchased|purchase|when did i get|when was it bought)\b/.test(t)){
  const date=zelmioSavedFact(e,'purchase');
  return date?askDate(date)+'.':full;
 }
 if(/warrant|guarantee|expir/.test(t)){
  const date=zelmioSavedFact(e,'warrantyDate');
  return date?'It expires on '+askDate(date)+'.':full;
 }
 if(/\b(where|location|find|kept|stored)\b/.test(t)){
  return full.replace(/^Your\s+.+?\s+is\s+/i,'');
 }
 return full;
}

let timelineFilter='upcoming';
function localToday(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function niceDate(s){if(!s)return 'Any time';let p=s.split('-');return p.length===3?new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):s}
function maintenanceTimeline(){
 let all=items(null,'job'),today=localToday(),completed=all.filter(j=>j.done).length,overdue=all.filter(j=>!j.done&&j.due&&j.due<today).length;
 let tabs=[['upcoming','Coming up'],['overdue','Overdue'],['all','All jobs'],['completed','Completed']];
 let jobs=all.filter(j=>timelineFilter==='all'||(timelineFilter==='completed'?j.done:timelineFilter==='overdue'?!j.done&&j.due&&j.due<today:!j.done));
 jobs.sort((a,b)=>{if(a.done!==b.done)return Number(a.done)-Number(b.done);return (a.due||'9999-99-99').localeCompare(b.due||'9999-99-99')});
 let groups={};for(let j of jobs){let label=j.done?'Completed':!j.due?'Whenever you’re ready':j.due<today?'Needs attention':j.due===today?'Today':niceDate(j.due);(groups[label]??=[]).push(j)}
 return `<div class="timelineHero"><div class="topline" style="color:#c9dfce">Keep your home happy</div><h2>Your maintenance timeline</h2><p>See what needs attention, tick off a job, and keep a record of the work you've done.</p><div class="timelineStats"><div><strong>${all.filter(j=>!j.done).length}</strong><small>To do</small></div><div><strong>${overdue}</strong><small>Overdue</small></div><div><strong>${completed}</strong><small>Completed</small></div></div><div class="progress"><div style="width:${all.length?Math.round(completed/all.length*100):0}%"></div></div></div><div class="row between"><h2 style="margin:8px 0">Your jobs</h2><button class="pill" onclick="capture('job')">＋ New job</button></div><div class="timelineFilters">${tabs.map(([id,label])=>`<button class="${timelineFilter===id?'active':''}" onclick="timelineFilter='${id}';render()">${label}</button>`).join('')}</div>${jobs.length?`<div class="timelineList">${Object.entries(groups).map(([group,arr])=>`<div class="timelineGroup">${esc(group)}</div>${arr.map(j=>`<article class="timelineCard ${j.done?'completed timelineDone':j.due&&j.due<today?'overdue':''}"><div class="tasktop"><button class="${j.done?'checked':''}" onclick="completeTimelineJob('${esc(j.id)}')" aria-label="${j.done?'Reopen':'Complete'} ${esc(j.title)}">${j.done?'✓':'○'}</button><div style="flex:1;min-width:0"><h3>${esc(j.title)}</h3><p>⌂ ${esc(roomName(j.room))} ${j.due?'· '+niceDate(j.due):''}</p>${!j.done&&j.due&&j.due<today?'<span class="timelineBadge">Overdue</span>':''}${j.repeat&&j.repeat!=='none'?`<p>↻ ${esc(repeatLabel(j.repeat))}</p>`:''}</div></div>${j.note?`<p style="margin-top:9px">${esc(j.note)}</p>`:''}<div class="taskactions"><button onclick="editEntry('${esc(j.id)}')">✎ Details</button>${j.appliance?`<button onclick="showRelatedItem('${esc(j.appliance)}')">↗ Related item</button>`:''}</div></article>`).join('')}`).join('')}</div>`:`<div class="timelineEmpty">✨<h3>${timelineFilter==='completed'?'Nothing completed yet':timelineFilter==='overdue'?'Nothing overdue — lovely!':'All clear for now'}</h3><p class="small">${timelineFilter==='completed'?'Tick off a job and it will appear here.':'Your maintenance jobs will appear here when you add them.'}</p></div>`}`
}
function repeatLabel(r){return ({weekly:'Every week',monthly:'Every month',quarterly:'Every 3 months',halfyear:'Every 6 months',yearly:'Every year'})[r]||'One-off'}
function nextRepeat(date,repeat){let d=date?new Date(date+'T12:00:00'):new Date();if(Number.isNaN(d.getTime()))d=new Date();let today=new Date(localToday()+'T12:00:00');let steps=0;do{if(repeat==='weekly')d.setDate(d.getDate()+7);else if(repeat==='monthly')d.setMonth(d.getMonth()+1);else if(repeat==='quarterly')d.setMonth(d.getMonth()+3);else if(repeat==='halfyear')d.setMonth(d.getMonth()+6);else if(repeat==='yearly')d.setFullYear(d.getFullYear()+1);else break;steps++}while(d<=today&&steps<100);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function completeTimelineJob(id){let e=state.entries.find(x=>x.id===id);if(!e)return;if(e.done){e.done=false;delete e.completedAt;toast('Job reopened')}else{e.done=true;e.completedAt=localToday();if(e.repeat&&e.repeat!=='none'){let id='e'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);state.entries.unshift({...e,id,done:false,completedAt:'',due:nextRepeat(e.due,e.repeat)});toast('Completed! Next job scheduled ✨')}else toast('Job completed! ✨')}save();render()}

function capture(type='item',room='',existing=null,spoken=''){draftPhoto=existing?.photo||'';let title=type==='item'?'Capture a belonging':type==='job'?'Add a job':'Remember a home detail';modal(head(title)+`<p class="small">${type==='item'?'Take a photo or choose one. Just a name and room is enough.':type==='job'?'One quick reminder — you can add more later.':'Keep a useful detail close to hand.'}</p><div class="photoActions"><label class="cameraLabel">📷 Take photo<input id="cameraInput" type="file" accept="image/*" capture="environment" onchange="readPhoto(this)"></label><label class="cameraLabel">🖼 Choose photo<input id="photoInput" type="file" accept="image/*" onchange="readPhoto(this)"></label></div><p class="small">Camera opens on supported phones. If it does not, choose a photo instead.</p><img id="preview" class="photoPreview ${draftPhoto?'':'hidden'}" src="${draftPhoto}" alt="Selected photo"><label class="field" for="entryTitle">${type==='job'?'What needs doing?':type==='detail'?'What would you like to remember?':'What is it?'}</label><input id="entryTitle" maxlength="100" placeholder="${type==='job'?'e.g. Clean the gutters':type==='detail'?'e.g. Hallway paint colour':'e.g. Spare duvet'}" value="${esc(existing?.title||spoken)}"><label class="field" for="entryRoom">Where?</label><select id="entryRoom"><option value="">Choose a room (optional)</option>${roomOpts(existing?.room||room)}</select>${type==='job'?`<label class="field">Due date (optional)</label><input type="date" id="entryDue" value="${esc(existing?.due||'')}">`:''}${type==='job'?`<label class="field">Repeat</label><select id="entryRepeat"><option value="none">One-off job</option>${['weekly','monthly','quarterly','halfyear','yearly'].map(x=>`<option value="${x}" ${existing?.repeat===x?'selected':''}>${repeatLabel(x)}</option>`).join('')}</select><label class="field">Related appliance or belonging (optional)</label><select id="entryAppliance"><option value="">No linked item</option>${state.entries.filter(x=>x.type==='item'&&(x.room===(existing?.room||room)||!room)).map(x=>`<option value="${esc(x.id)}" ${existing?.appliance===x.id?'selected':''}>${esc(x.title)} · ${esc(roomName(x.room))}</option>`).join('')}</select>`:''}${type==='item'||type==='detail'?`<details class="extra-fields" ${existing?.model||existing?.warranty||existing?.manual||existing?.history?'open':''}><summary>＋ Appliance, warranty & document details</summary><label class="field">Model / reference (optional)</label><input id="entryModel" placeholder="e.g. Bosch WGG244" value="${esc(existing?.model||'')}"><label class="field">Purchase date (optional)</label><input type="date" id="entryPurchased" value="${esc(existing?.purchased||'')}"><label class="field">Warranty expiry (optional)</label><input type="date" id="entryWarranty" value="${esc(existing?.warranty||'')}"><label class="field">Manual or document web link (optional)</label><input id="entryManual" type="url" placeholder="https://…" value="${esc(existing?.manual||'')}"><label class="field">Maintenance history (optional)</label><textarea id="entryHistory" placeholder="e.g. Serviced 12 June 2026">${esc(existing?.history||'')}</textarea></details>`:''}<label class="field">Extra notes (optional)</label><textarea id="entryNote" placeholder="Anything else worth remembering…">${esc(existing?.note||'')}</textarea><div class="row" style="margin-top:16px"><button class="pill" style="flex:1" onclick="saveEntry('${type}','${existing?.id||''}')">Save ${type==='job'?'job':type==='detail'?'detail':'item'} ✓</button>${existing?`<button class="tiny danger" onclick="deleteEntry('${existing.id}')">Delete</button>`:''}</div>`);if(room||existing?.room)document.getElementById('entryRoom').value=existing?.room||room}
async function readPhoto(el){let file=el.files?.[0];if(!file)return;try{draftPhoto=await resize(file);let p=document.getElementById('preview');p.src=draftPhoto;p.classList.remove('hidden');toast('Photo ready ✓')}catch(e){toast('Could not read that photo')}}
function resize(file){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let scale=Math.min(1,950/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.7))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('image'))};img.src=url})}
function saveEntry(type,id){
 const title=document.getElementById('entryTitle').value.trim();
 if(!title){toast('Give it a name first');return}
 const pin=pendingPin?{...pendingPin}:null;

 let obj=id?state.entries.find(x=>x.id===id):null;
 if(id&&!obj){toast('Item not found. Please try again');return}
 if(!obj){
   let newId;

 }
 Object.assign(obj,{title,room:pin?pin.room:document.getElementById('entryRoom').value,note:document.getElementById('entryNote').value.trim(),photo:draftPhoto});
 if(type==='job'){obj.due=document.getElementById('entryDue').value;obj.repeat=document.getElementById('entryRepeat')?.value||'none';obj.appliance=document.getElementById('entryAppliance')?.value||'';}
 if(type==='item'||type==='detail'){obj.model=document.getElementById('entryModel')?.value.trim()||'';obj.purchased=document.getElementById('entryPurchased')?.value||'';obj.warranty=document.getElementById('entryWarranty')?.value||'';obj.manual=document.getElementById('entryManual')?.value.trim()||'';obj.history=document.getElementById('entryHistory')?.value.trim()||'';}
 if(pin&&isNew){
   const room=state.rooms.find(r=>r.id===pin.room);
   if(room){room.pins=room.pins||[];room.pins.push({x:pin.x,y:pin.y,entryId:obj.id})}
 }
 if(save()){
   pendingPin=null;pinMode=false;closeModal();render();
   toast(pin&&isNew?'New item linked to its own marker ✓':'Saved to your home ✓');
 }else if(pin&&isNew){
   const room=state.rooms.find(r=>r.id===pin.room);
   if(room)room.pins=room.pins.filter(p=>p.entryId!==obj.id);
   state.entries=state.entries.filter(e=>e.id!==obj.id);
 }
}
function editEntry(id){let e=state.entries.find(x=>x.id===id);if(e)capture(e.type,e.room,e)}
function deleteEntry(id){if(!confirm('Delete this saved entry?'))return;state.entries=state.entries.filter(x=>x.id!==id);save();closeModal();render();toast('Removed')}
function toggleJob(id){completeTimelineJob(id)}
function addRoom(){modal(head('Make space for more')+`<p class="muted">Bedroom 2, Study, Utility, Shed, Summerhouse — anything you like.</p><label class="field">Room or space name</label><input id="roomTitle" placeholder="e.g. Bedroom 2" maxlength="45"><div class="photoActions"><label class="cameraLabel">📷 Take room photo<input type="file" accept="image/*" capture="environment" onchange="readPhoto(this)"></label><label class="cameraLabel">🖼 Choose room photo<input type="file" accept="image/*" onchange="readPhoto(this)"></label></div><img id="preview" class="photoPreview hidden" alt="Room photo"><button class="pill" style="width:100%;margin-top:14px" onclick="saveRoom()">Create my space →</button>`)}
function saveRoom(){let name=document.getElementById('roomTitle').value.trim();if(!name){toast('Give your space a name');return}let id='r'+Date.now();state.rooms.push({id,name,photo:draftPhoto||DEFAULT_ROOM_IMAGES[7]});save();closeModal();go('room',id);toast('New space created ✨')}
function editRoom(id){let r=state.rooms.find(x=>x.id===id);if(!r)return;draftPhoto=r.photo;modal(head('Personalise this space')+`<label class="field">Name</label><input id="roomTitle" value="${esc(r.name)}" maxlength="45"><div class="photoActions"><label class="cameraLabel">📷 Take new photo<input type="file" accept="image/*" capture="environment" onchange="readPhoto(this)"></label><label class="cameraLabel">🖼 Choose photo<input type="file" accept="image/*" onchange="readPhoto(this)"></label></div><img id="preview" class="photoPreview" src="${r.photo}" alt="Room photo"><button class="pill" style="margin-top:12px" onclick="updateRoom('${id}')">Save changes</button> ${DEFAULT_NAMES.some((n,i)=>'r'+i===id)?'':`<button class="tiny danger" onclick="deleteRoom('${id}')">Delete room</button>`}`)}
function updateRoom(id){let r=state.rooms.find(x=>x.id===id);r.name=document.getElementById('roomTitle').value.trim()||r.name;r.photo=draftPhoto||r.photo;save();closeModal();render();toast('Room updated')}
function deleteRoom(id){let count=items(id).length;if(!confirm(`Delete this room? ${count?count+' saved entries will become unassigned.':''}`))return;state.rooms=state.rooms.filter(x=>x.id!==id);state.entries.forEach(e=>{if(e.room===id)e.room=''});save();closeModal();go('home')}
function voiceStart(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){modal(head('Voice capture')+`<p>Voice recognition isn't available in this browser or file. You can type a quick sentence here, or try Zelmio on an HTTPS website in Chrome.</p><input id="spoken" placeholder="e.g. Clean the gutters next month"><button class="pill" style="margin-top:12px" onclick="spokenNext()">Continue →</button>`);return}modal(head('Say it to Zelmio')+`<p class="muted">Listening… Say something like “Clean the gutters” or “The bedroom paint is olive green”.</p><div class="empty" style="font-size:52px">🎙️</div><p id="voiceStatus" class="small">Waiting for your voice…</p><button class="pill light" onclick="closeModal()">Cancel</button>`);let rec=new SR();rec.lang='en-GB';rec.interimResults=false;rec.onresult=e=>{let s=e.results[0][0].transcript;voiceChoice(s)};rec.onerror=e=>{let el=document.getElementById('voiceStatus');if(el)el.textContent='Microphone unavailable: '+e.error+'. Use the + button to type instead.'};try{rec.start()}catch(e){toast('Microphone unavailable')}}
function spokenNext(){voiceChoice(document.getElementById('spoken').value.trim())}
function voiceChoice(s){if(!s)return;modal(head('Got it!')+`<p class="muted">“${esc(s)}”</p><p>What kind of note is this?</p><button class="choice" onclick="capture('job','','','${''}')" id="unused" style="display:none"></button><button class="choice" onclick="voiceSave('job')">✓ A job to do</button><button class="choice" onclick="voiceSave('detail')">◇ A home detail</button><button class="choice" onclick="voiceSave('item')">▣ A belonging</button>`);window._spoken=s}
function voiceSave(type){capture(type,view==='room'?(selectedRoom||''):'',null,window._spoken||'')}
function openSettings(){modal(head('Your Zelmio')+`<p class="muted">This prototype stores your information in this browser, on this device. It does not send photos to a server.</p><button class="choice" onclick="exportData()">⬇ Export a backup (JSON)</button><label class="choice" style="cursor:pointer">⬆ Restore a backup <input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label><p class="small">Camera and voice availability depend on your browser and permissions. Voice recognition, when available, may use your browser provider's speech service. Photos are not automatically identified by AI in this offline prototype.</p>`)}
function exportData(){let blob=new Blob([JSON.stringify(state)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='zelmio-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup downloaded')}
async function importData(input){try{let data=JSON.parse(await input.files[0].text());if(!Array.isArray(data.rooms)||!Array.isArray(data.entries))throw Error('format');if(!confirm('Replace your current Zelmio data with this backup?'))return;state=data;save();closeModal();go('home');toast('Backup restored ✓')}catch(e){toast('Invalid backup file')}}
render();
</script></body></html>
